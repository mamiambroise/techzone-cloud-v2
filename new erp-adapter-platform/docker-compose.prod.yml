version: '3.8'

services:
  # ========== POSTGRESQL ==========
  postgres-prod:
    image: postgres:15-alpine
    container_name: erp-postgres-prod
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: erp_adapter_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - erp_prod_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== REDIS (Cache & Queue) ==========
  redis-prod:
    image: redis:7-alpine
    container_name: erp-redis-prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_prod_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - erp_prod_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== BACKEND ==========
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        NODE_ENV: production
    container_name: erp-backend-prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=https://erp-admin.techzone.com
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-prod:6379
      - SENTRY_DSN=${SENTRY_DSN}
      - DOLIBARR_URL=${DOLIBARR_URL}
      - DOLIBARR_API_KEY=${DOLIBARR_API_KEY}
      - RATE_LIMIT_WINDOW=60000
      - RATE_LIMIT_MAX=100
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - PROMETHEUS_ENABLED=true
    env_file:
      - ./backend/.env.production
    ports:
      - "3000:3000"
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    networks:
      - erp_prod_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ========== NGINX (Reverse Proxy) ==========
  nginx-prod:
    image: nginx:alpine
    container_name: erp-nginx-prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-prod
    networks:
      - erp_prod_network
    restart: unless-stopped

  # ========== PROMETHEUS (Monitoring) ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: erp-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - erp_prod_network
    restart: unless-stopped

  # ========== GRAFANA (Visualisation) ==========
  grafana:
    image: grafana/grafana:latest
    container_name: erp-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - erp_prod_network
    restart: unless-stopped

networks:
  erp_prod_network:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  prometheus_data:
  grafana_data: