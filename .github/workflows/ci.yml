name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend — lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint (tsc --noEmit)
        run: npm run lint
        working-directory: frontend

      - name: Unit tests (Vitest)
        run: npm test
        working-directory: frontend

      - name: Build (Vite)
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend — Prisma, Nest and IAM E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: techzone
          POSTGRES_PASSWORD: techzone_test_password
          POSTGRES_DB: techzone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U techzone -d techzone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://techzone:techzone_test_password@localhost:5432/techzone_test?schema=business_manager
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Prisma generate
        run: npx prisma generate
        working-directory: backend

      - name: Apply isolated test migrations
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: IAM E2E (isolated PostgreSQL)
        run: npm run test:e2e -- --runInBand
        working-directory: backend

      - name: Build (NestJS)
        run: npx nest build
        working-directory: backend
